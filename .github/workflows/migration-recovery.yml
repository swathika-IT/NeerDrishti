name: Migration Recovery Integration

on:
  workflow_dispatch:
  pull_request:

jobs:
  migration-recovery:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MIGRATION_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/neerdrishti_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Wait for MongoDB
        env:
          MIGRATION_TEST_MONGODB_URI: ${{ env.MIGRATION_TEST_MONGODB_URI }}
        run: |
          node <<'NODE'
          const net = require('net');
          const uri = process.env.MIGRATION_TEST_MONGODB_URI || '';
          if (!uri || !uri.startsWith('mongodb://')) {
            console.error('MIGRATION_TEST_MONGODB_URI must be a local mongodb:// URI');
            process.exit(1);
          }
          let parsed;
          try { parsed = new URL(uri); } catch {
            console.error('Invalid MIGRATION_TEST_MONGODB_URI');
            process.exit(1);
          }
          if (!['localhost', '127.0.0.1'].includes(parsed.hostname)) {
            console.error('Only localhost/127.0.0.1 MongoDB URIs are allowed');
            process.exit(1);
          }
          const port = Number(parsed.port || 27017);
          (async () => {
            for (let i = 0; i < 30; i++) {
              const ok = await new Promise(resolve => {
                const socket = net.createConnection({ host: parsed.hostname, port }, () => {
                  socket.end();
                  resolve(true);
                });
                socket.on('error', () => resolve(false));
                socket.setTimeout(2000, () => { socket.destroy(); resolve(false); });
              });
              if (ok) {
                console.log('MongoDB port ready');
                process.exit(0);
              }
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            console.error('MongoDB did not become ready');
            process.exit(1);
          })();
          NODE
      - run: npx tsx --test tests/migration_recovery.test.ts tests/migration_recovery_phase2.test.ts tests/migration_recovery_integration.test.ts
      - run: npm run lint
      - run: npm run build
