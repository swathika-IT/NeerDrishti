# Render Blueprint for NeerDrishti.
# The application runtime uses MongoDB. No persistent disk is required.
services:
  - type: web
    name: neerdrishti
    runtime: node
    plan: free
    region: singapore
    branch: sqlite-to-mongo-staging
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start            # verifies MongoDB, then starts the server
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      # Set this to the staging MongoDB connection string in the Render dashboard.
      - key: MONGODB_URI
        sync: false
      # Keep true until the SQLite importer has populated the target database.
      - key: NEERDRISHTI_STAGING_IMPORT_MODE
        value: "true"
      - key: NEERDRISHTI_SEED_REFERENCE_DATA
        value: "false"
      - key: APP_BASE_URL
        sync: false                    # e.g. https://neerdrishti.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AUTH_DEV_EXPOSE_TOKENS
        value: "false"
      - key: NOTIFICATION_DRY_RUN
        value: "true"                  # keep true until live sending is explicitly approved
      - key: NOTIFICATION_LIVE_SEND_ENABLED
        value: "false"
      - key: MAIL_DRY_RUN
        value: "true"
      - key: SMS_ENABLED
        value: "false"
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: SECURITY_CSP_ENABLED
        value: "true"
      - key: REQUEST_LOG_ENABLED
        value: "true"
      # Basemap: leave unset for the local fallback. Set to an authorised tile URL (with your key) to enable tiles.
      - key: MAP_TILE_URL
        sync: false
      - key: MAP_TILE_ATTRIBUTION
        sync: false
      # Hosted LLM is optional. Without it the assistant uses deterministic fallbacks.
      # localhost Ollama is NOT reachable from Render.
      - key: LLM_PROVIDER
        value: llama
      - key: OPENAI_COMPATIBLE_BASE_URL
        sync: false                    # e.g. https://api.groq.com/openai/v1
      - key: OPENAI_COMPATIBLE_API_KEY
        sync: false
      - key: OPENAI_COMPATIBLE_MODEL
        sync: false                    # e.g. llama-3.1-8b-instant
